<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routing SPA Fallback (file-based) — NoJS E2E</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; color: #333; }
    section { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1.5rem; border-radius: 4px; }
    nav a { margin-right: 1rem; color: #1a5fb4; }
  </style>
</head>
<body>
  <section>
    <h1 data-test="shell">File-based routes behind an SPA fallback server</h1>
    <nav>
      <a href="/spa-file/" route="/" data-test="nav-home">Home</a>
      <a href="/spa-file/about" route="/about" data-test="nav-about">About</a>
      <a href="/spa-file/p/hello" route="/p/hello" lazy="ondemand" data-test="nav-post">Post</a>
      <a href="/spa-file/missing" route="/missing" data-test="nav-missing">Missing</a>
    </nav>
  </section>

  <section>
    <main route-view data-test="outlet"></main>
  </section>

  <template route="*"><p data-test="page-404">File 404 <span bind="$route.path" data-test="404-path"></span></p></template>

  <script src="/__local__/no.js"></script>
  <script>
    NoJS.config({ router: { base: '/spa-file', templates: '/spa-file/pages' } });
  </script>
</body>
</html>
